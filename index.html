<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 Fiyat Hesaplayıcı - Mobil + Firebase</title>

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Segoe UI,Tahoma;background:#f0f2f5;padding:10px}
  h2,h3{text-align:center;color:#1a73e8;margin:10px 0}
  input,button{width:100%;padding:10px;margin-bottom:8px;font-size:15px}
  input{border:1px solid #ccc;border-radius:6px;text-align:center}
  button{border:none;border-radius:6px;background:#1a73e8;color:#fff;font-weight:bold}
  button:active{transform:scale(.98)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border:1px solid #ddd;padding:6px;text-align:center}
  th{background:#1a73e8;color:#fff}
  .total{color:#0a8a3a;font-weight:bold}
  .del{background:#f44336}
  .wrap{overflow-x:auto}
  #results{background:#fff;border:1px solid #ccc;border-radius:6px;display:none;max-height:320px;overflow-y:auto;margin-top:-4px;margin-bottom:10px;box-shadow:0 8px 22px rgba(0,0,0,.12)}
  #results .result-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid #f0f0f0;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px}
  #results .result-item:last-child{border-bottom:none}
  #results .result-item:hover,#results .result-item.active{background:#eef5ff}
  #results .result-item small{color:#1a73e8;font-size:11px;white-space:nowrap}
  #results .search-status{padding:11px 12px;color:#666;text-align:center;font-size:13px}
</style>
</head>

<body>

<h2>💰 Dolar - TL Fiyat Hesaplayıcı</h2>

<input id="model" placeholder="Model adı">
<input id="dollarRate" type="number" step="0.01">
<input id="search" placeholder="🔍 Model ara" oninput="searchModels()">
<div id="results"></div>

<button onclick="saveModel()">💾 Kaydet</button>
<button onclick="addRow()">➕ Satır Ekle</button>
<button onclick="clearFields()">🧹 Temizle</button>

<div class="wrap">
<table>
<thead>
<tr>
<th>Tür</th><th>$</th><th>TL</th><th>Kâr</th><th>Toplam</th><th>❌</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<h3>🧮 Genel Toplam: <span id="grandTotal">0</span> TL</h3>

<script type="module">
/* 🔥 Firebase */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC6ZpIkEi9KMErwJpw2HFK-Wj51dcP6-S0",
  authDomain: "price-calculator-f17c7.firebaseapp.com",
  projectId: "price-calculator-f17c7",
  storageBucket: "price-calculator-f17c7.firebasestorage.app",
  messagingSenderId: "541750328906",
  appId: "1:541750328906:web:755597e8f21164492f70b3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================== 💲 DOLLAR (Firebase Sync) ================== */
async function loadDollarRate(){
  const snap = await getDoc(doc(db,"settings","dollar"));
  if(snap.exists()){
    dollarRate.value = snap.data().value;
    calc();
  }else{
    dollarRate.value = 50;
  }
}

async function saveDollarRate(rate){
  await setDoc(
    doc(db,"settings","dollar"),
    { value: rate },
    { merge:true }
  );
}

let dollarTimer=null;
dollarRate.addEventListener("input",e=>{
  const r=parseFloat(e.target.value);
  if(isNaN(r)) return;
  calc();
  clearTimeout(dollarTimer);
  dollarTimer=setTimeout(()=>saveDollarRate(r),600);
});

/* ================== TABLE ================== */
let rowCount=0;

function addRow(name="",usd=0,profit=0){
  rowCount++;
  const tr=document.createElement("tr");
  tr.innerHTML=`
    <td><input value="${name}" oninput="calc()"></td>
    <td><input type="number" value="${usd}" oninput="calc()"></td>
    <td class="tl">0</td>
    <td><input type="number" value="${profit}" oninput="calc()"></td>
    <td class="total">0</td>
    <td><button class="del" onclick="this.closest('tr').remove();calc()">X</button></td>
  `;
  tableBody.appendChild(tr);
  calc();
}
window.addRow=addRow;

function calc(){
  const rate=parseFloat(dollarRate.value)||0;
  let sum=0;
  document.querySelectorAll("#tableBody tr").forEach(tr=>{
    const usd=parseFloat(tr.children[1].firstChild.value)||0;
    const profit=parseFloat(tr.children[3].firstChild.value)||0;
    const tl=usd*rate;
    const total=tl+profit;
    tr.querySelector(".tl").innerText=tl.toFixed(2);
    tr.querySelector(".total").innerText=total.toFixed(2);
    sum+=total;
  });
  grandTotal.innerText=sum.toFixed(2);
}
window.calc=calc;

function clearFields(){
  tableBody.innerHTML="";
  rowCount=0;
  addRow();
}
window.clearFields=clearFields;

/* ================== MODELS ================== */
async function saveModel(){
  if(!model.value.trim()) return alert("Model gir");
  const rows=[];
  document.querySelectorAll("#tableBody tr").forEach(tr=>{
    rows.push({
      name:tr.children[0].firstChild.value,
      usd:+tr.children[1].firstChild.value||0,
      profit:+tr.children[3].firstChild.value||0
    });
  });
  const savedName=model.value.trim();
  await setDoc(doc(db,"models",savedName),{rows});
  upsertModelInIndex(savedName);
  alert("Kaydedildi");
}
window.saveModel=saveModel;

async function loadModel(name){
  const snap=await getDoc(doc(db,"models",name));
  if(!snap.exists()) return;
  model.value=name;
  tableBody.innerHTML="";
  rowCount=0;
  snap.data().rows.forEach(r=>addRow(r.name,r.usd,r.profit));
  results.style.display="none";
}
window.loadModel=loadModel;

/* ================== 🔍 SMART SEARCH ================== */
const searchInput=document.getElementById("search");
const searchResults=document.getElementById("results");
let modelIndex=[];
let modelIndexPromise=null;
let currentMatches=[];
let activeIndex=-1;
let searchTimer=null;

function normalizeText(value=""){
  const digitMap={
    '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9',
    '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'
  };
  return String(value)
    .replace(/[٠-٩۰-۹]/g,ch=>digitMap[ch]||ch)
    .replace(/İ/g,'I').replace(/ı/g,'i')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/ş/g,'s').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ö/g,'o').replace(/ü/g,'u')
    .replace(/[^a-z0-9]+/g,' ')
    .trim().replace(/\s+/g,' ');
}
function compact(value=""){return normalizeText(value).replace(/\s+/g,'');}
function tokens(value=""){
  const n=normalizeText(value);
  return n?n.split(' ').flatMap(part=>part.match(/[a-z]+|\d+/g)||[]):[];
}
function numbers(value=""){return normalizeText(value).match(/\d+/g)||[];}

function levenshtein(a,b,maxDistance=Infinity){
  if(a===b)return 0;
  if(!a.length)return b.length;
  if(!b.length)return a.length;
  if(Math.abs(a.length-b.length)>maxDistance)return maxDistance+1;
  let prev=Array.from({length:b.length+1},(_,i)=>i),curr=new Array(b.length+1);
  for(let i=1;i<=a.length;i++){
    curr[0]=i; let rowMin=curr[0];
    for(let j=1;j<=b.length;j++){
      const cost=a[i-1]===b[j-1]?0:1;
      curr[j]=Math.min(curr[j-1]+1,prev[j]+1,prev[j-1]+cost);
      rowMin=Math.min(rowMin,curr[j]);
    }
    if(rowMin>maxDistance)return maxDistance+1;
    [prev,curr]=[curr,prev];
  }
  return prev[b.length];
}

function subsequenceScore(query,text){
  let qi=0,gaps=0,last=-1;
  for(let i=0;i<text.length&&qi<query.length;i++){
    if(text[i]===query[qi]){
      if(last>=0)gaps+=i-last-1;
      last=i; qi++;
    }
  }
  if(qi!==query.length)return 0;
  return Math.max(0,420-gaps*8-(text.length-query.length)*2);
}

function tokenSimilarity(qTokens,modelTokens){
  if(!qTokens.length||!modelTokens.length)return 0;
  let total=0;
  for(const q of qTokens){
    let best=0;
    const qIsNumber=/^\d+$/.test(q);
    for(const m of modelTokens){
      if(q===m){best=1;break;}
      if(m.startsWith(q)||q.startsWith(m))best=Math.max(best,.92);
      if(m.includes(q)||q.includes(m))best=Math.max(best,.82);
      if(qIsNumber||/^\d+$/.test(m))continue;
      if(q.length<3||m.length<3)continue;
      const maxD=Math.max(1,Math.floor(Math.max(q.length,m.length)*.34));
      const d=levenshtein(q,m,maxD);
      if(d<=maxD)best=Math.max(best,1-d/Math.max(q.length,m.length));
    }
    if(best<.55)return 0;
    total+=best;
  }
  return total/qTokens.length;
}

function scoreModel(query,item){
  const qNorm=normalizeText(query),qCompact=compact(query),qTokens=tokens(query),qNumbers=numbers(query);
  if(!qNorm)return 0;

  // Keep model numbers strict: S24 should not be confused with S23, etc.
  if(qNumbers.length){
    const numberMatch=qNumbers.every(qn=>item.numbers.some(mn=>qn===mn||(qn.length===1&&mn.startsWith(qn))));
    if(!numberMatch)return 0;
  }

  const n=item.normalized,c=item.compact;
  let score=0;
  if(n===qNorm)score=Math.max(score,1200);
  if(c===qCompact)score=Math.max(score,1160);
  if(n.startsWith(qNorm))score=Math.max(score,1050-(n.length-qNorm.length));
  if(c.startsWith(qCompact))score=Math.max(score,1010-(c.length-qCompact.length));
  if(n.includes(qNorm))score=Math.max(score,930-n.indexOf(qNorm)*3);
  if(c.includes(qCompact))score=Math.max(score,900-c.indexOf(qCompact)*3);

  const tokenSim=tokenSimilarity(qTokens,item.tokens);
  if(tokenSim>0){
    const allExactOrPrefix=qTokens.every(q=>item.tokens.some(m=>m===q||m.startsWith(q)||q.startsWith(m)));
    score=Math.max(score,(allExactOrPrefix?850:650)+Math.round(tokenSim*130));
  }

  if(qCompact.length>=3){
    score=Math.max(score,subsequenceScore(qCompact,c));
    const maxD=Math.max(1,Math.floor(qCompact.length*.30));
    if(Math.abs(c.length-qCompact.length)<=maxD+4){
      const d=levenshtein(qCompact,c,maxD+4);
      const sim=1-d/Math.max(qCompact.length,c.length);
      if(sim>=.62)score=Math.max(score,520+Math.round(sim*180));
    }
  }
  return score>0?score-Math.min(35,Math.max(0,c.length-qCompact.length)):0;
}

function indexEntry(id){
  return {id,normalized:normalizeText(id),compact:compact(id),tokens:tokens(id),numbers:numbers(id)};
}

async function ensureModelIndex(){
  if(modelIndex.length)return modelIndex;
  if(modelIndexPromise)return modelIndexPromise;
  modelIndexPromise=(async()=>{
    const snap=await getDocs(collection(db,"models"));
    modelIndex=snap.docs.map(d=>indexEntry(d.id));
    return modelIndex;
  })();
  try{return await modelIndexPromise;}
  finally{modelIndexPromise=null;}
}

function upsertModelInIndex(id){
  const i=modelIndex.findIndex(x=>x.id===id);
  const entry=indexEntry(id);
  if(i>=0)modelIndex[i]=entry;
  else if(modelIndex.length)modelIndex.push(entry);
}

function renderSuggestions(matches){
  searchResults.innerHTML="";
  activeIndex=-1;
  if(!matches.length){
    const empty=document.createElement("div");
    empty.className="search-status";
    empty.textContent="Eşleşen model bulunamadı";
    searchResults.appendChild(empty);
    searchResults.style.display="block";
    return;
  }
  matches.forEach((match,index)=>{
    const div=document.createElement("div");
    div.className="result-item";
    const label=document.createElement("span");
    label.textContent=match.id;
    div.appendChild(label);
    if(index===0&&matches.length>1){
      const hint=document.createElement("small");
      hint.textContent="En yakın";
      div.appendChild(hint);
    }
    div.addEventListener("mousedown",e=>e.preventDefault());
    div.addEventListener("click",()=>{
      searchInput.value=match.id;
      loadModel(match.id);
    });
    searchResults.appendChild(div);
  });
  searchResults.style.display="block";
}

async function performSearch(){
  const query=searchInput.value.trim();
  if(!query){
    searchResults.innerHTML="";
    searchResults.style.display="none";
    currentMatches=[];
    return;
  }
  if(!modelIndex.length){
    searchResults.innerHTML='<div class="search-status">Aranıyor…</div>';
    searchResults.style.display="block";
  }
  try{
    const index=await ensureModelIndex();
    if(query!==searchInput.value.trim())return;
    currentMatches=index
      .map(item=>({id:item.id,score:scoreModel(query,item)}))
      .filter(item=>item.score>0)
      .sort((a,b)=>b.score-a.score||a.id.length-b.id.length||a.id.localeCompare(b.id,'tr'))
      .slice(0,10);
    renderSuggestions(currentMatches);
  }catch(err){
    console.error(err);
    searchResults.innerHTML='<div class="search-status">Arama sırasında hata oluştu</div>';
    searchResults.style.display="block";
  }
}

function searchModels(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(performSearch,90);
}
window.searchModels=searchModels;

searchInput.addEventListener("keydown",e=>{
  const items=[...searchResults.querySelectorAll(".result-item")];
  if(e.key==="ArrowDown"&&items.length){e.preventDefault();activeIndex=(activeIndex+1)%items.length;}
  else if(e.key==="ArrowUp"&&items.length){e.preventDefault();activeIndex=(activeIndex-1+items.length)%items.length;}
  else if(e.key==="Enter"&&items.length){
    e.preventDefault();
    const selected=currentMatches[activeIndex>=0?activeIndex:0];
    if(selected){searchInput.value=selected.id;loadModel(selected.id);}
    return;
  }else if(e.key==="Escape"){searchResults.style.display="none";return;}
  else return;
  items.forEach((el,i)=>el.classList.toggle("active",i===activeIndex));
  items[activeIndex]?.scrollIntoView({block:"nearest"});
});

document.addEventListener("click",e=>{
  if(!searchInput.contains(e.target)&&!searchResults.contains(e.target))searchResults.style.display="none";
});

// Preload once. Search after this is local and does not re-read Firestore on every keystroke.
ensureModelIndex().catch(console.error);

/* ================== INIT ================== */
loadDollarRate();
addRow();
</script>

</body>
</html>
