<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 Fiyat Hesaplayıcı</title>

<style>
/* ========== BASE ========== */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: #f0f2f5;
  color: #333;
  padding: 20px;
  transition: 0.3s;
}

h2, h3 { color: #1a73e8; margin-bottom: 10px; }

input, button {
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 15px;
}

button {
  background: #1a73e8;
  color: #fff;
  border: none;
  cursor: pointer;
}

button:hover { background: #155ab6; }

.control {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}

/* ========== TABLE (DESKTOP) ========== */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

th, td {
  padding: 12px;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

th { background: #1a73e8; color: #fff; }

.total { color: #0a8f4d; font-weight: bold; }

/* ========== CARDS (MOBILE) ========== */
.cards { display: none; }

.card {
  background: #fff;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.card-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
}

/* ========== DARK MODE ========== */
body.dark {
  background: #121212;
  color: #eee;
}

body.dark h2, body.dark h3 { color: #90caf9; }

body.dark table, body.dark .card {
  background: #1e1e1e;
}

body.dark th { background: #333; }

body.dark input {
  background: #2b2b2b;
  color: #fff;
  border-color: #555;
}

/* ========== PRINT ========== */
@media print {
  button, .control, #darkToggle { display: none; }
  body { background: #fff; color: #000; }
}

/* ========== MOBILE ========== */
@media (max-width: 768px) {
  table { display: none; }
  .cards { display: block; }
}
</style>
</head>

<body>

<h2>💰 Fiyat Hesaplayıcı</h2>

<div class="control">
  <input id="model" placeholder="Model adı">
  <input id="rate" type="number" step="0.01" value="42.29">
  <button onclick="addRow()">➕ Satır</button>
  <button onclick="toggleDark()" id="darkToggle">🌙</button>
  <button onclick="window.print()">🖨️ Yazdır</button>
</div>

<!-- TABLE -->
<table>
<thead>
<tr>
  <th>Tür</th>
  <th>Dolar</th>
  <th>Kâr</th>
  <th>Toplam</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<!-- CARDS -->
<div class="cards" id="cards"></div>

<h3>🧮 Genel Toplam: <span id="grand">0</span> TL</h3>

<script>
let data = [];

function addRow(name="", usd=0, profit=0) {
  data.push({name, usd, profit});
  render();
}

function render() {
  const rate = parseFloat(rateInput.value) || 0;
  let totalAll = 0;

  rows.innerHTML = "";
  cards.innerHTML = "";

  data.forEach((r, i) => {
    const total = r.usd * rate + r.profit;
    totalAll += total;

    // table
    rows.innerHTML += `
      <tr>
        <td><input value="${r.name}" oninput="data[${i}].name=this.value"></td>
        <td><input type="number" value="${r.usd}" oninput="data[${i}].usd=+this.value;render()"></td>
        <td><input type="number" value="${r.profit}" oninput="data[${i}].profit=+this.value;render()"></td>
        <td class="total">${total.toFixed(2)}</td>
      </tr>
    `;

    // card
    cards.innerHTML += `
      <div class="card">
        <div class="card-row"><b>Tür</b><span>${r.name}</span></div>
        <div class="card-row"><b>Dolar</b><span>${r.usd}</span></div>
        <div class="card-row"><b>Kâr</b><span>${r.profit}</span></div>
        <div class="card-row total"><b>Toplam</b><span>${total.toFixed(2)} TL</span></div>
      </div>
    `;
  });

  grand.innerText = totalAll.toFixed(2);
}

function toggleDark() {
  document.body.classList.toggle("dark");
  localStorage.setItem("dark", document.body.classList.contains("dark"));
}

const rateInput = document.getElementById("rate");
rateInput.oninput = render;

if (localStorage.getItem("dark") === "true") toggleDark();

addRow();
</script>

</body>
</html>
